workflows:
  flutter-ios-workflow:
    name: Flutter iOS Build
    environment:
      xcode: latest  # Codemagic will use macOS for iOS builds
    triggering:
      events: [push]
      branch_patterns:
        - pattern: "main"
    scripts:
      # 1. Flutter setup (works on Windows)
      - name: Flutter dependencies
        script: |
          flutter pub get

      # 2. Codemagic will handle iOS-specific steps on their macOS builders
      - name: Build iOS IPA
        script: |
          cd ios
          pod install
          xcode-project build-ipa \
            --workspace "Runner.xcworkspace" \
            --scheme "Runner" \
            --export-options-plist "../ExportOptions.plist"
    artifacts:
      - ios/build/ios/ipa/*.ipa
