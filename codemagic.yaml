workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Find Xcode files
        script: |
          echo "Project structure:"
          ls -R
          echo "Xcode workspace locations:"
          find . -name "*.xcworkspace" -print
          echo "Xcode project locations:"
          find . -name "*.xcodeproj" -print

      - name: Build IPA
        script: |
          # Try common locations
          if [ -f "ios/Runner.xcworkspace" ]; then
            # Flutter project structure
            cd ios
            xcode-project build-ipa \
              --workspace "Runner.xcworkspace" \
              --scheme "Runner" \
              --export-options-plist "../ExportOptions.plist"
          elif [ -f "YourApp.xcworkspace" ]; then
            # Native iOS project in root
            xcode-project build-ipa \
              --workspace "YourApp.xcworkspace" \
              --scheme "YourApp" \
              --export-options-plist "ExportOptions.plist"
          elif [ -f "ios/YourApp.xcodeproj" ]; then
            # Project file instead of workspace
            cd ios
            xcode-project build-ipa \
              --project "YourApp.xcodeproj" \
              --scheme "YourApp" \
              --export-options-plist "../ExportOptions.plist"
          else
            echo "ERROR: No Xcode workspace or project found"
            find . -name "*.xcworkspace" -o -name "*.xcodeproj"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
