workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest  # Specify Xcode version here instead of under 'macos'
    triggering:
      events: [push]
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Checkout code
        script: |
          git submodule update --init --recursive

      - name: Find Xcode project
        script: |
          find . -name "*.xcodeproj" -print
          find . -name "*.xcworkspace" -print

      - name: Build IPA
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "YourApp.xcworkspace" \
            --scheme "YourApp" \
            --archive-flags "SKIP_INSTALL=NO" \
            --export-options-plist "../ExportOptions.plist"
    artifacts:
      - ios/build/ios/ipa/*.ipa
