workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Find Xcode files
        script: |
          find . -name "*.xcworkspace" -o -name "*.xcodeproj"
          
      - name: Install Pods
        script: |
          cd ios
          pod install
          
      - name: Build IPA
        script: |
          cd ios
          xcode-project build-ipa \
            --workspace "MyApp.xcworkspace" \  # ACTUAL workspace name
            --scheme "MyApp" \  # ACTUAL scheme name
            --export-options-plist "ExportOptions.plist"
    artifacts:
      - ios/build/ios/ipa/*.ipa
