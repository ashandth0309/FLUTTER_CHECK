workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: "main"
    scripts:
      - name: Check project structure
        script: |
          echo "Project contents:"
          ls -la
          echo "iOS directory contents:"
          ls -la ios/ || echo "No ios directory"

      - name: Install Pods (if needed)
        script: |
          # Check for Podfile in different locations
          if [ -f "ios/Podfile" ]; then
            echo "Found Podfile in ios directory"
            cd ios
            pod install
          elif [ -f "Podfile" ]; then
            echo "Found Podfile in root directory"
            pod install
          else
            echo "No Podfile found - proceeding without CocoaPods"
          fi

      - name: Build IPA
        script: |
          # Determine correct project path
          if [ -f "ios/YourApp.xcworkspace" ]; then
            cd ios
            WORKSPACE="YourApp.xcworkspace"
          elif [ -f "YourApp.xcworkspace" ]; then
            WORKSPACE="YourApp.xcworkspace"
          else
            echo "Error: Could not find .xcworkspace file"
            exit 1
          fi

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "YourApp" \
            --export-options-plist "ExportOptions.plist"
    artifacts:
      - build/ios/ipa/*.ipa
